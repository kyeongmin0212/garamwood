<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>body{background:#F6EFE2;padding:50px;font-family:Fraunces,serif}
.grid{display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start}
.cell{text-align:center;color:#2B1D11}
.lbl{font-size:13px;margin-top:10px;color:#5C3A1E}
.dark{background:#2B1D11;color:#F6EFE2;padding:18px;border-radius:8px}</style></head>
<body>
<div class="grid">

<!-- A: 살짝 겹침, 굵은 링 -->
<div class="cell">
<svg width="90" height="90" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18.4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="13.6" fill="none" stroke="currentColor" stroke-width="1"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-family="Fraunces,serif" font-weight="700" font-size="18" letter-spacing="-2.2" fill="currentColor">GW</text></svg>
<div class="lbl">A · 700 / size18 / 겹침-2.2</div></div>

<!-- B: 더 크고 더 겹침 -->
<div class="cell">
<svg width="90" height="90" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18.4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="13.6" fill="none" stroke="currentColor" stroke-width="1"/><text x="20" y="21.2" text-anchor="middle" dominant-baseline="central" font-family="Fraunces,serif" font-weight="900" font-size="19.5" letter-spacing="-3" fill="currentColor">GW</text></svg>
<div class="lbl">B · 900 / size19.5 / 겹침-3</div></div>

<!-- C: 중간, 링 더 두껍게 -->
<div class="cell">
<svg width="90" height="90" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="3.6"/><circle cx="20" cy="20" r="12.8" fill="none" stroke="currentColor" stroke-width="1"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-family="Fraunces,serif" font-weight="700" font-size="17.5" letter-spacing="-2.4" fill="currentColor">GW</text></svg>
<div class="lbl">C · 링3.6 / 700 / 겹침-2.4</div></div>

<!-- A small + dark -->
<div class="cell dark">
<svg width="48" height="48" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18.4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="13.6" fill="none" stroke="currentColor" stroke-width="1"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-family="Fraunces,serif" font-weight="700" font-size="18" letter-spacing="-2.2" fill="currentColor">GW</text></svg>
<div class="lbl">A 어두움</div></div>

<!-- A tiny nav size -->
<div class="cell">
<svg width="28" height="28" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18.4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="13.6" fill="none" stroke="currentColor" stroke-width="1"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-family="Fraunces,serif" font-weight="700" font-size="18" letter-spacing="-2.2" fill="currentColor">GW</text></svg>
<div class="lbl">A 28px</div></div>

</div>
</body></html>
